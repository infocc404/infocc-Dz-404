<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>info cc 404 — منصة طلبة الإعلام الآلي</title>
  <meta name="description" content="منصة ملفات طلبة مهندس دولة في الإعلام الآلي (الأفواج G1 إلى G10).">
  <meta name="theme-color" content="#F5EFE6">

  <!-- Icons & PWA -->
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- OpenGraph -->
  <meta property="og:title" content="info cc 404 — منصة طلبة الإعلام الآلي">
  <meta property="og:description" content="منصة ملفات طلبة مهندس دولة في الإعلام الآلي (الأفواج G1 إلى G10).">
  <meta property="og:type" content="website">

  <!-- Google Fonts: Readex Pro + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <!-- PDF.js 3.11.174 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }
  </script>

  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- Config (MUST be before app.js) -->
  <script src="config.js"></script>

  <!-- Academic Data -->
  <script src="data.js"></script>
</head>
<body>
  <!-- Root App Mount -->
  <div id="appRoot">
    <div style="padding: 40px; text-align: center; color: #7A6A5C;">جاري التحميل...</div>
  </div>

  <!-- Diagnostics: replace the endless loading screen with a useful error if startup fails. -->
  <script>
    (function () {
      const root = document.getElementById("appRoot");
      function showStartupError(message) {
        if (!root) return;
        const stillLoading = root.textContent && root.textContent.includes("جاري التحميل");
        if (!stillLoading) return;
        root.innerHTML = "";
        const panel = document.createElement("div");
        panel.dir = "rtl";
        panel.style.cssText = "max-width:760px;margin:48px auto;padding:24px;border:1px solid #d8b9a1;border-radius:16px;background:#fffaf4;color:#49392e;font:16px/1.9 sans-serif;text-align:right;box-shadow:0 8px 30px #0000000d";
        const title = document.createElement("h2");
        title.textContent = "تعذّر تشغيل الموقع";
        title.style.marginTop = "0";
        const detail = document.createElement("p");
        detail.textContent = message || "لم يبدأ ملف app.js أو حدث خطأ أثناء تحميل أحد الملفات.";
        const steps = document.createElement("p");
        steps.textContent = "تحقق من أن index.html وapp.js وconfig.js وstyle.css موجودة في جذر مستودع GitHub، ثم افتح أدوات المطور (F12) ← Console لمعرفة الخطأ الأحمر. لم يتم حذف أي بيانات من Supabase.";
        panel.append(title, detail, steps);
        root.appendChild(panel);
      }
      window.addEventListener("error", function (event) {
        if (event && event.message) showStartupError("خطأ JavaScript: " + event.message);
      });
      window.addEventListener("unhandledrejection", function (event) {
        const reason = event && event.reason;
        showStartupError("خطأ أثناء بدء التشغيل: " + (reason && reason.message ? reason.message : String(reason || "غير معروف")));
      });
      window.setTimeout(function () {
        showStartupError("انتهت مهلة بدء التشغيل. قد يكون app.js لم يُحمّل، أو أن اتصال الشبكة/مكتبة Supabase تعذّر تحميله.");
      }, 15000);
    })();
  </script>

  <!-- App Entry Script -->
  <script type="module" src="app.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
